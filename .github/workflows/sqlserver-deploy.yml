name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          $folders = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($folder in $folders) {
            if (-not (Test-Path "./sql/$folder")) {
              Write-Error "Missing folder: sql/$folder"
              exit 1
            }

            $files = Get-ChildItem "./sql/$folder" -Filter "*.sql"

            Write-Host "$folder -> $($files.Count) files"
            $files | Sort-Object Name | ForEach-Object {
              Write-Host "   $($_.Name)"
            }
          }

          Write-Host "Validation completed"

  deploy:
    name: Deploy All Databases
    runs-on: self-hosted
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Test SQL Instance
      - name: Test SQL Server Instance
        shell: powershell
        run: |
          Write-Host "Testing SQL Server instance (.\\SQLDBMIG)..."

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -Q "SELECT @@SERVERNAME" `
            -C `
            -b 2>&1

          Write-Host $result

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cannot connect to SQL Server instance .\SQLDBMIG"
            exit 1
          }

          Write-Host "Instance connection successful"

      # ✅ Step 2: Test Credentials
      - name: Test SQL Credentials
        shell: powershell
        run: |
          $user = '${{ secrets.SQLUSER }}'
          $pass = '${{ secrets.SQLPASSWORD }}'

          Write-Host "Testing login for user: $user"

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -d "master" `
            -U "$user" `
            -P "$pass" `
            -C `
            -Q "SELECT 'LOGIN OK'" `
            -b 2>&1

          Write-Host $result

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Login FAILED"
            exit 1
          }

          Write-Host "Login successful"

      # ✅ Step 3: Deploy all DBs using sqlcmd
      - name: Deploy Databases
        shell: powershell
        run: |
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'
          $server = ".\SQLDBMIG"

          $databases = @("TESTDB1","TESTDB2","TESTDB3")

          foreach ($db in $databases) {

            Write-Host "======================================="
            Write-Host "Deploying Database: $db"
            Write-Host "======================================="

            $files = Get-ChildItem ".\sql\$db\*.sql" | Sort-Object Name

            foreach ($file in $files) {

              Write-Host "Executing: $($file.Name)"

              sqlcmd `
                -S "$server" `
                -d "$db" `
                -U "$user" `
                -P "$pass" `
                -C `
                -i "$($file.FullName)"

              if ($LASTEXITCODE -ne 0) {
                Write-Error "FAILED: $($file.Name)"
                exit 1
              }
            }

            Write-Host "$db deployed successfully"
          }

      # ✅ Step 4: Completion
      - name: Deployment Complete
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "✅ ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "Instance : .\SQLDBMIG"
          Write-Host "Branch   : ${{ github.ref_name }}"
          Write-Host "User     : ${{ github.actor }}"
          Write-Host "======================================="
