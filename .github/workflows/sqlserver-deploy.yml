name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Scripts
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folder
        shell: powershell
        run: |

          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          $folders = Get-ChildItem "./sql" -Directory

          if ($folders.Count -eq 0) {
            Write-Error "No database folders found!"
            exit 1
          }

          Write-Host "Database folders found:"
          $folders | ForEach-Object { Write-Host " - $($_.Name)" }

  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        shell: powershell
        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # =========================
          # FLYWAY PATH
          # =========================

          $flywayBase = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0"
          $flywayCmd = "$flywayBase\flyway.cmd"

          if (-not (Test-Path $flywayCmd)) {
            Write-Error "Flyway not found!"
            exit 1
          }

          Write-Host "Using Flyway: $flywayCmd"

          # =========================
          # SQL SERVER (FIXED)
          # =========================

          $server = "localhost"

          Write-Host ""
          Write-Host "Detecting SQL Server port..."

          $connection = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                        Where-Object {
                          $_.OwningProcess -in (Get-Process sqlservr -ErrorAction SilentlyContinue).Id
                        }

          if (-not $connection) {
            Write-Error "SQL Server not running or port not found."
            exit 1
          }

          $sqlPort = ($connection.LocalPort | Sort-Object -Unique | Select-Object -First 1)

          Write-Host "Detected SQL Server Port: $sqlPort"

          # =========================
          # TEST CONNECTION
          # =========================

          $test = Test-NetConnection -ComputerName $server -Port $sqlPort -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Error "SQL Server NOT reachable on localhost:$sqlPort"
            exit 1
          }

          Write-Host "SQL Server connection OK."

          # =========================
          # DATABASE MAP
          # =========================

          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # =========================
          # DEPLOY
          # =========================

          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error "Missing folder for $db"
              exit 1
            }

            $url = "jdbc:sqlserver://localhost:$sqlPort;databaseName=$db;encrypt=false;trustServerCertificate=true"

            Write-Host ""
            Write-Host "---------------------------------------"
            Write-Host "Deploying Database : $db"
            Write-Host "Port               : $sqlPort"
            Write-Host "Path               : $path"
            Write-Host "---------------------------------------"

            & $flywayCmd `
              -X `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flyway migration FAILED for $db"
              exit 1
            }

            Write-Host "SUCCESS: $db deployed successfully."
          }

      - name: Deployment Completed
        shell: powershell
        run: |

          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="