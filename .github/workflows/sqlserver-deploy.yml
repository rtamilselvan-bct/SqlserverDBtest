name: SQL Server Multi-DB Deployment (Flyway)

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:
  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          $folders = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($folder in $folders) {
            if (-not (Test-Path "./sql/$folder")) {
              Write-Error "Missing folder: sql/$folder"
              exit 1
            }

            $files = Get-ChildItem "./sql/$folder" -Filter "*.sql"
            Write-Host "$folder -> $($files.Count) files found"
          }

          Write-Host "Validation completed"

  deploy:
    name: Deploy All Databases
    runs-on: self-hosted
    needs: validate
    env:
      # Your specific server name
      SQL_SERVER: "BCTCL-DL5420628"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Test Connectivity to Server
      - name: Test SQL Server Connection
        shell: powershell
        run: |
          Write-Host "Testing connection to $env:SQL_SERVER on port 1433..."
          $connection = Test-NetConnection -ComputerName "$env:SQL_SERVER" -Port 1433
          
          if ($connection.TcpTestSucceeded -eq $false) {
            Write-Error "Cannot reach SQL Server $env:SQL_SERVER on port 1433. Check firewall."
            exit 1
          }
          Write-Host "Network connection successful"

      # ✅ Step 2: Deploy All Databases using Flyway
      - name: Flyway Migration
        shell: powershell
        run: |
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'
          $server = "$env:SQL_SERVER"
          
          # List of databases to migrate
          $databases = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($db in $databases) {
            Write-Host "---------------------------------------"
            Write-Host "RUNNING MIGRATION FOR: $db"
            Write-Host "---------------------------------------"

            # Constructing the JDBC URL for SQL Server
            # encrypt=true and trustServerCertificate=true are often required for internal servers
            $jdbcUrl = "jdbc:sqlserver://$server;databaseName=$db;encrypt=true;trustServerCertificate=true"

            # Execute Flyway
            # -locations points to the specific subfolder for this DB
            flyway migrate `
              -url="$jdbcUrl" `
              -user="$user" `
              -password="$pass" `
              -locations="filesystem:sql/$db" `
              -connectRetries=10

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flyway migration FAILED for database: $db"
              exit 1
            }
            
            Write-Host "Successfully migrated $db"
          }

      # ✅ Step 3: Summary
      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "✅ DEPLOYMENT COMPLETE"
          Write-Host "Server : $env:SQL_SERVER"
          Write-Host "Status : All Flyway migrations finished"
          Write-Host "Time   : $(Get-Date)"
          Write-Host "======================================="