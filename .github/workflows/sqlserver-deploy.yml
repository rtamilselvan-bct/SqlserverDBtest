name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |

          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          $folders = Get-ChildItem "./sql" -Directory

          if ($folders.Count -eq 0) {
            Write-Error "No database folders found!"
            exit 1
          }

          $folders | ForEach-Object {
            Write-Host ("Found DB Folder: {0}" -f $_.Name)
          }

  deploy:
    name: Deploy Databases (Flyway)
    runs-on: self-hosted
    needs: validate

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        shell: powershell
        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # =========================
          # FLYWAY PATH
          # =========================
          $flyway = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0\flyway.cmd"

          if (-not (Test-Path $flyway)) {
            Write-Error "Flyway not found!"
            exit 1
          }

          Write-Host "Using Flyway: $flyway"

          # =========================
          # SQL SERVER (STABLE MODE)
          # =========================
          $server = "localhost"
          $sqlPort = 52969

          Write-Host ("Using SQL Server: {0}:{1}" -f $server, $sqlPort)

          # =========================
          # CONNECTION TEST
          # =========================
          $test = Test-NetConnection -ComputerName $server -Port $sqlPort -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Error ("SQL Server NOT reachable on {0}:{1}" -f $server, $sqlPort)
            exit 1
          }

          Write-Host "SQL Server connection OK."

          # =========================
          # DATABASE MAP
          # =========================
          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # =========================
          # DEPLOY LOOP
          # =========================
          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error ("Missing folder for {0}" -f $db)
              exit 1
            }

            $url = "jdbc:sqlserver://localhost:$sqlPort;databaseName=$db;encrypt=false;trustServerCertificate=true"

            Write-Host ""
            Write-Host "---------------------------------------"
            Write-Host ("Deploying Database : {0}" -f $db)
            Write-Host ("Path              : {0}" -f $path)
            Write-Host "---------------------------------------"

            & $flyway `
              -X `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error ("Flyway migration FAILED for {0}" -f $db)
              exit 1
            }

            Write-Host ("SUCCESS: {0} deployed successfully." -f $db)
          }

      - name: Deployment Completed
        shell: powershell
        run: |

          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="