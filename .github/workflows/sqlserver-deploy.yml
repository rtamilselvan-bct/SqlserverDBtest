name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          $folders = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($folder in $folders) {
            if (-not (Test-Path "./sql/$folder")) {
              Write-Error "Missing folder: sql/$folder"
              exit 1
            }

            $files = Get-ChildItem "./sql/$folder" -Filter "*.sql"
            Write-Host "$folder -> $($files.Count) SQL files"
          }

          Write-Host "All folders OK"

  deploy:
    name: Deploy All Databases
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Test Instance (NO PORT)
      - name: Test SQL Server Instance
        shell: powershell
        run: |
          Write-Host "Testing instance .\SQLDBMIG ..."

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -Q "SELECT @@SERVERNAME" `
            -C `
            -b 2>&1

          Write-Host $result

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cannot connect to .\SQLDBMIG"
            exit 1
          }

          Write-Host "Instance OK"

      # ✅ Step 2: Test Login
      - name: Test SQL Credentials
        shell: powershell
        run: |
          $user = '${{ secrets.SQLUSER }}'
          $pass = '${{ secrets.SQLPASSWORD }}'

          Write-Host "Testing login for $user"

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -d "master" `
            -U "$user" `
            -P "$pass" `
            -C `
            -Q "SELECT 'LOGIN OK'" `
            -b 2>&1

          Write-Host $result

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Login FAILED"
            exit 1
          }

          Write-Host "Login OK"

      # ✅ Step 3: Deploy DBs (NO TCP / NO PORT)
      - name: Deploy Databases
        shell: powershell
        run: |
          $flyway = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0\flyway.cmd"
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'

          $databases = @("TESTDB1","TESTDB2","TESTDB3")

          foreach ($db in $databases) {

            Write-Host "---------------------------------------"
            Write-Host "Deploying: $db"
            Write-Host "---------------------------------------"

            # ✅ KEY FIX → use instance (not port)
           $url = "jdbc:sqlserver://localhost\\SQLDBMIG;databaseName=$db;encrypt=false;trustServerCertificate=true"

            & $flyway `
              -url="$url" `
              -user="$user" `
              -password="$pass" `
              -locations="filesystem:.\sql\$db" `
              -baselineOnMigrate=true `
              -validateOnMigrate=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "$db FAILED"
              exit 1
            }

            Write-Host "$db SUCCESS"
          }

      - name: Deployment Complete
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED"
          Write-Host "Instance: .\SQLDBMIG"
          Write-Host "======================================="