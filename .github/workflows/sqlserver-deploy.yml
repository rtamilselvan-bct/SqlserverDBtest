name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1 — Validate SQL Scripts
  # ==========================================
  validate:
    name: Validate SQL Scripts
    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folder
        shell: powershell
        run: |

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VALIDATING SQL FOLDERS"
          Write-Host "======================================="

          $folders = Get-ChildItem "./sql" -Directory

          if ($folders.Count -eq 0) {
            Write-Error "No database folders found!"
            exit 1
          }

          foreach ($folder in $folders) {
            Write-Host " -> $($folder.Name)"
          }

  # ==========================================
  # JOB 2 — Deploy Databases
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Flyway Migration
        shell: powershell

        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # ======================================
          # Flyway Installation Path
          # ======================================

          $flyway = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0\flyway.cmd"

          if (-not (Test-Path $flyway)) {
            Write-Error "Flyway executable not found!"
            exit 1
          }

          # ======================================
          # SQL Server TCP Port
          # Replace if your SQL Server uses
          # a different TCP port
          # ======================================

          $sqlPort = "1433"

          # ======================================
          # Database Mapping
          # ======================================

          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # ======================================
          # Execute Deployment
          # ======================================

          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error "Migration folder missing for $db"
              exit 1
            }

            # ======================================
            # JDBC URL
            # ======================================

            $url = "jdbc:sqlserver://localhost`:$sqlPort;databaseName=$db;encrypt=false;trustServerCertificate=true;loginTimeout=30"

            Write-Host ""
            Write-Host "--------------------------------------"
            Write-Host "Deploying Database : $db"
            Write-Host "Scripts Path       : $path"
            Write-Host "--------------------------------------"

            & $flyway `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              -outOfOrder=false `
              migrate

            if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "======================================="
              Write-Host "DEPLOYMENT FAILED FOR $db"
              Write-Host "======================================="

              exit 1
            }

            Write-Host ""
            Write-Host "SUCCESSFULLY DEPLOYED : $db"
          }

      - name: Deployment Completed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="