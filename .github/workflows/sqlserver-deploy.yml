name: SQL Server Multi-DB Deployment (Flyway)

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:

  # ✅ 1. VALIDATION
  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          $folders = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($folder in $folders) {
            if (-not (Test-Path "./sql/$folder")) {
              Write-Error "❌ Missing folder: sql/$folder"
              exit 1
            }

            $files = Get-ChildItem "./sql/$folder" -Filter "*.sql"
            Write-Host "$folder -> $($files.Count) files found"

            foreach ($file in $files) {
              if ($file.Name -notmatch '^V\d+__.*\.sql$') {
                Write-Warning "⚠️ Invalid naming: $($file.Name)"
              }
            }
          }

          Write-Host "✅ Validation completed"


  # ✅ 2. DEPLOY TO DEV
  deploy-dev:
    name: Deploy to Development
    runs-on: self-hosted
    needs: validate
    if: github.ref == 'refs/heads/Development'

    env:
      SQL_SERVER: "BCTCL-DL5420628"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Test SQL connectivity
      - name: Test SQL Connection
        shell: powershell
        run: |
          $conn = Test-NetConnection -ComputerName "$env:SQL_SERVER" -Port 1433
          if ($conn.TcpTestSucceeded -eq $false) {
            Write-Error "❌ Cannot connect to SQL Server"
            exit 1
          }
          Write-Host "✅ SQL connection OK"

      # ✅ Download Flyway (FIXED: uses .exe)
      - name: Download Flyway
        shell: powershell
        run: |
          $url = "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-windows-x64.zip"
          $zip = "$env:RUNNER_TEMP\flyway.zip"
          $dir = "$env:RUNNER_TEMP\flyway"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force

          $flyway = Get-ChildItem -Path $dir -Recurse -Filter "flyway.exe" | Select-Object -First 1

          if (-not $flyway) {
            Write-Error "❌ flyway.exe not found"
            Get-ChildItem -Recurse $dir
            exit 1
          }

          echo "FLYWAY_CMD=$($flyway.FullName)" >> $env:GITHUB_ENV

          Write-Host "✅ Flyway ready: $($flyway.FullName)"

      # ✅ Run DEV migrations
      - name: Run DEV Flyway Migration
        shell: powershell
        run: |
          $flyway = "$env:FLYWAY_CMD"
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'
          $server = "$env:SQL_SERVER"

          if (-not (Test-Path $flyway)) {
            Write-Error "❌ Flyway not found at $flyway"
            exit 1
          }

          $dbs = @("TESTDB1","TESTDB2","TESTDB3")

          foreach ($db in $dbs) {

            Write-Host "======================================="
            Write-Host "🚀 DEV DEPLOY: $db"
            Write-Host "======================================="

            $url = "jdbc:sqlserver://$server;databaseName=$db;encrypt=true;trustServerCertificate=true"

            & "$flyway" migrate `
              -url="$url" `
              -user="$user" `
              -password="$pass" `
              -locations="filesystem:sql/$db" `
              -connectRetries=10 `
              -connectRetriesInterval=5

            if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ DEV deployment failed: $db"
              exit 1
            }

            Write-Host "✅ DEV deployed: $db"
          }


  # ✅ 3. APPROVAL STEP
  approval:
    name: Manager Approval Required
    runs-on: self-hosted
    needs: deploy-dev

    environment:
      name: Production   # ✅ triggers approval

    steps:
      - name: Waiting for approval
        run: echo "⏸ Waiting for manager approval..."


  # ✅ 4. DEPLOY TO PROD
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    needs: approval

    env:
      SQL_SERVER: "BCTCL-DL5420628"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Download Flyway again (job isolation safe)
      - name: Download Flyway
        shell: powershell
        run: |
          $url = "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-windows-x64.zip"
          $zip = "$env:RUNNER_TEMP\flyway.zip"
          $dir = "$env:RUNNER_TEMP\flyway"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force

          $flyway = Get-ChildItem -Path $dir -Recurse -Filter "flyway.exe" | Select-Object -First 1

          if (-not $flyway) {
            Write-Error "❌ flyway.exe not found"
            exit 1
          }

          echo "FLYWAY_CMD=$($flyway.FullName)" >> $env:GITHUB_ENV

      # ✅ Run PROD migrations
      - name: Run PROD Flyway Migration
        shell: powershell
        run: |
          $flyway = "$env:FLYWAY_CMD"
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'
          $server = "$env:SQL_SERVER"

          if (-not (Test-Path $flyway)) {
            Write-Error "❌ Flyway not found at $flyway"
            exit 1
          }

          $dbs = @("TESTDB1","TESTDB2","TESTDB3")

          foreach ($db in $dbs) {

            Write-Host "======================================="
            Write-Host "🔥 PROD DEPLOY: $db"
            Write-Host "======================================="

            $url = "jdbc:sqlserver://$server;databaseName=$db;encrypt=true;trustServerCertificate=true"

            & "$flyway" migrate `
              -url="$url" `
              -user="$user" `
              -password="$pass" `
              -locations="filesystem:sql/$db"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ PROD deployment failed: $db"
              exit 1
            }

            Write-Host "✅ PROD deployed: $db"
          }

      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================="
          Write-Host "✅ PRODUCTION DEPLOYMENT COMPLETE"
          Write-Host "Server : $env:SQL_SERVER"
          Write-Host "Time   : $(Get-Date)"
          Write-Host "======================================="