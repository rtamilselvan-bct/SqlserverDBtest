name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1 — Validate SQL Structure
  # ==========================================
  validate:
    name: Validate SQL Scripts
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folder
        shell: powershell
        run: |

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          Write-Host "SQL folder found."

          $folders = Get-ChildItem "./sql" -Directory

          if ($folders.Count -eq 0) {
            Write-Error "No database folders found!"
            exit 1
          }

          foreach ($folder in $folders) {
            Write-Host " -> $($folder.Name)"
          }

  # ==========================================
  # JOB 2 — Deploy Databases
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        shell: powershell
        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # ======================================
          # Flyway Path
          # ======================================
          $flyway = "C:\Users\tr117372\flyway\flyway-10.15.0\flyway.cmd"

          if (-not (Test-Path $flyway)) {
            Write-Error "Flyway not found!"
            exit 1
          }

          # ======================================
          # SQL SERVER CONFIG
          # ======================================
          $server = "localhost"
          $sqlPort = "1433"

          # ======================================
          # CHECK SQL SERVER CONNECTION
          # ======================================
          Write-Host "Checking SQL Server connectivity..."

          $test = Test-NetConnection -ComputerName $server -Port $sqlPort -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Error "SQL Server NOT reachable on ${server}:${sqlPort}"
            Write-Host "Fix required:"
            Write-Host "1. Enable TCP/IP in SQL Server Configuration Manager"
            Write-Host "2. Set correct port (avoid NULL dynamic port)"
            Write-Host "3. Restart SQL Server service"
            exit 1
          }

          Write-Host "SQL Server connection OK."

          # ======================================
          # DATABASE MAPPING
          # ======================================
          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # ======================================
          # DEPLOY LOOP
          # ======================================
          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error "Missing folder for $db"
              exit 1
            }

            # FIXED: safe PowerShell string formatting
            $url = "jdbc:sqlserver://$server`:$sqlPort;databaseName=$db;encrypt=false;trustServerCertificate=true;loginTimeout=30"

            Write-Host ""
            Write-Host "--------------------------------------"
            Write-Host "Deploying DB : $db"
            Write-Host "Path         : $path"
            Write-Host "--------------------------------------"

            & $flyway `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAILED for $db"
              exit 1
            }

            Write-Host "SUCCESS: $db"
          }

      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="