name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Scripts
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folder
        shell: powershell
        run: |

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          Write-Host "SQL folder found."

          $folders = Get-ChildItem "./sql" -Directory

          if ($folders.Count -eq 0) {
            Write-Error "No database folders found!"
            exit 1
          }

          foreach ($folder in $folders) {
            Write-Host " -> $($folder.Name)"
          }

  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        shell: powershell
        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # ======================================
          # Flyway Path (FIXED)
          # ======================================
          $flywayBase = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0"

          $flyway = "$flywayBase\flyway.cmd"
          $flywayBin = "$flywayBase\bin\flyway.cmd"

          if (Test-Path $flyway) {
            $flywayCmd = $flyway
          }
          elseif (Test-Path $flywayBin) {
            $flywayCmd = $flywayBin
          }
          else {
            Write-Error "Flyway not found!"
            exit 1
          }

          Write-Host "Using Flyway: $flywayCmd"

          # ======================================
          # AUTO-DETECT SQL SERVER PORT (FIX)
          # ======================================

          $server = "localhost"

          Write-Host "Detecting SQL Server port..."

          $connection = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                        Where-Object { $_.OwningProcess -in (Get-Process sqlservr -ErrorAction SilentlyContinue).Id }

          if (-not $connection) {
            Write-Error "Unable to detect SQL Server port. Ensure SQL Server is running."
            exit 1
          }

          $sqlPort = $connection.LocalPort

          Write-Host "Detected SQL Server Port: $sqlPort"

          # ======================================
          # TEST CONNECTION
          # ======================================
          $test = Test-NetConnection -ComputerName $server -Port $sqlPort -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Error "SQL Server NOT reachable on ${server}:${sqlPort}"
            exit 1
          }

          Write-Host "SQL Server connection OK."

          # ======================================
          # DATABASE MAP
          # ======================================
          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # ======================================
          # DEPLOY
          # ======================================
          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error "Missing folder for $db"
              exit 1
            }

            $url = "jdbc:sqlserver://$server`:$sqlPort;databaseName=$db;encrypt=false;trustServerCertificate=true;loginTimeout=30"

            Write-Host ""
            Write-Host "--------------------------------------"
            Write-Host "Deploying DB : $db"
            Write-Host "Port         : $sqlPort"
            Write-Host "--------------------------------------"

            & $flywayCmd `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAILED for $db"
              exit 1
            }

            Write-Host "SUCCESS: $db"
          }

      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="