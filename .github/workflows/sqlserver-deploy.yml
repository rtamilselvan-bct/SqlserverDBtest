name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Structure
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folders
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "VALIDATING SQL STRUCTURE"
          Write-Host "======================================="

          $folders = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($folder in $folders) {
            if (-not (Test-Path "./sql/$folder")) {
              Write-Error "Missing folder: sql/$folder"
              exit 1
            }

            $files = Get-ChildItem "./sql/$folder" -Filter "*.sql"
            Write-Host "$folder -> $($files.Count) SQL files"

            $files | Sort-Object Name | ForEach-Object {
              Write-Host "   $($_.Name)"
            }
          }

          Write-Host "All folders validated successfully"

  deploy:
    name: Deploy All Databases
    runs-on: self-hosted
    needs: validate
    environment: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Test SQL Server Instance
      - name: Test SQL Server Connection
        shell: powershell
        run: |
          Write-Host "Testing SQL Server instance (.\\SQLDBMIG)..."

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -Q "SELECT @@SERVERNAME" `
            -C `
            -b 2>&1

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cannot connect to SQL Server instance .\SQLDBMIG"
            exit 1
          }

          Write-Host "SQL Server instance reachable"

      # ✅ Step 2: Test Credentials
      - name: Test SQL Credentials
        shell: powershell
        run: |
          Write-Host "Testing SQL credentials..."

          $user = '${{ secrets.SQLUSER }}'
          $pass = '${{ secrets.SQLPASSWORD }}'

          Write-Host "Username: $user"
          Write-Host "Password length: $($pass.Length)"

          $result = sqlcmd `
            -S ".\SQLDBMIG" `
            -d "master" `
            -U "$user" `
            -P "$pass" `
            -C `
            -Q "SELECT 'LOGIN OK', @@SERVERNAME" `
            -b 2>&1

          Write-Host "Result: $result"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Credentials FAILED"
            exit 1
          }

          Write-Host "Credentials OK"

      # ✅ Step 3: Deploy ALL databases (loop)
      - name: Deploy All Databases
        shell: powershell
        run: |
          $flyway = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0\flyway.cmd"
          $user   = '${{ secrets.SQLUSER }}'
          $pass   = '${{ secrets.SQLPASSWORD }}'

          $databases = @("TESTDB1", "TESTDB2", "TESTDB3")

          foreach ($db in $databases) {

            Write-Host "---------------------------------------"
            Write-Host "Deploying Database : $db"
            Write-Host "---------------------------------------"

            $url = "jdbc:sqlserver://localhost;instanceName=SQLDBMIG;databaseName=$db;encrypt=false;trustServerCertificate=true"

            & $flyway `
              -url="$url" `
              -user="$user" `
              -password="$pass" `
              -locations="filesystem:.\sql\$db" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "$db DEPLOYMENT FAILED"
              exit 1
            }

            Write-Host "$db DEPLOYED SUCCESSFULLY"
          }

      # ✅ Step 4: Done
      - name: Deployment Complete
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "Instance : .\SQLDBMIG"
          Write-Host "Branch   : ${{ github.ref_name }}"
          Write-Host "User     : ${{ github.actor }}"
          Write-Host "======================================="