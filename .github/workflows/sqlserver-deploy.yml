name: SQL Server Multi-DB Deployment

on:
  push:
    branches:
      - Development

  workflow_dispatch:

jobs:

  validate:
    name: Validate SQL Scripts
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SQL Folder
        shell: powershell
        run: |

          if (-not (Test-Path "./sql")) {
            Write-Error "sql folder missing!"
            exit 1
          }

          Write-Host "SQL folder OK"

  deploy:
    name: Deploy Databases
    runs-on: self-hosted
    needs: validate

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        shell: powershell
        env:
          DB_USER: ${{ secrets.SQLUSER }}
          DB_PASS: ${{ secrets.SQLPASSWORD }}

        run: |

          Write-Host "======================================="
          Write-Host "STARTING MULTI-DB DEPLOYMENT"
          Write-Host "======================================="

          # =========================
          # FLYWAY PATH
          # =========================
          $flyway = "C:\Users\tr117372\flyway\flyway\flyway-10.15.0\flyway.cmd"

          if (-not (Test-Path $flyway)) {
            Write-Error "Flyway not found!"
            exit 1
          }

          Write-Host "Using Flyway: $flyway"

          # =========================
          # SQL SERVER (YOUR REQUESTED SERVER)
          # =========================
          $server = "BCTCL-DL5420628\SQLDBMIG"

          Write-Host "Using SQL Server Instance: $server"

          # =========================
          # DATABASE MAP
          # =========================
          $dbMap = @{
            "TESTDB1" = ".\sql\TESTDB1"
            "TESTDB2" = ".\sql\TESTDB2"
            "TESTDB3" = ".\sql\TESTDB3"
          }

          # =========================
          # DEPLOY LOOP
          # =========================
          foreach ($db in $dbMap.Keys) {

            $path = $dbMap[$db]

            if (-not (Test-Path $path)) {
              Write-Error "Missing folder for $db"
              exit 1
            }

            # IMPORTANT: named instance format for Flyway JDBC
            $url = "jdbc:sqlserver://$server;databaseName=$db;encrypt=false;trustServerCertificate=true"

            Write-Host ""
            Write-Host "---------------------------------------"
            Write-Host "Deploying Database : $db"
            Write-Host "Server             : $server"
            Write-Host "Path               : $path"
            Write-Host "---------------------------------------"

            & $flyway `
              -X `
              -url="$url" `
              -user="$env:DB_USER" `
              -password="$env:DB_PASS" `
              -locations="filesystem:$path" `
              -validateOnMigrate=true `
              -baselineOnMigrate=true `
              -cleanDisabled=true `
              migrate

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flyway migration FAILED for $db"
              exit 1
            }

            Write-Host "SUCCESS: $db deployed successfully."
          }

      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host "======================================="
          Write-Host "ALL DATABASES DEPLOYED SUCCESSFULLY"
          Write-Host "======================================="